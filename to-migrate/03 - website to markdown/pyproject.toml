[project]
name = "website-to-markdown"
version = "0.1.0"
description = "Tool for converting websites to markdown and processing web documents"
readme = "README.md"
authors = [
    { name = "mercurial-weasel", email = "dbraendler@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1.0.0",
    "lancedb>=0.4.0",
    "crawl4ai>=0.1.0",
    "openai>=1.2.0",
    "docling>=0.3.0",
    "requests>=2.31.0",
]

# Update the entry points to use both module and script approach
[project.scripts]
website-to-md = "src.website_pipeline.cli:run_cli"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.deptry]
ignore_imports = [
    "src.utils.*"
]

[tool.deptry.per_file_ignores]
"src/url_to_markdown/main.py" = ["src.utils.*"]
